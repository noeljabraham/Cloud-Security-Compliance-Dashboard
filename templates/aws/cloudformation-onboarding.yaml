AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cloud Security Compliance Dashboard - Cross-Account Read-Only Onboarding Role'

Parameters:
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: 'Cryptographically unique External ID generated by Cloud Security Dashboard to prevent confused deputy attacks.'
  CloudSecPrincipalArn:
    Type: String
    Default: 'arn:aws:iam::111122223333:root'
    Description: 'The ARN of the CloudSec platform IAM principal allowed to assume this role.'
  RoleName:
    Type: String
    Default: 'CloudSecSecurityAuditRole'
    Description: 'Name of the cross-account IAM role to create.'

Resources:
  CloudSecAuditPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${RoleName}Policy'
      Description: 'Least-privilege read-only permissions for Cloud Security posture assessment'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3ReadPermissions
            Effect: Allow
            Action:
              - 's3:GetAccountPublicAccessBlock'
              - 's3:GetBucketPublicAccessBlock'
              - 's3:GetBucketPolicy'
              - 's3:GetBucketPolicyStatus'
              - 's3:GetBucketAcl'
              - 's3:GetEncryptionConfiguration'
              - 's3:GetBucketLocation'
              - 's3:GetBucketLogging'
              - 's3:GetBucketVersioning'
              - 's3:ListAllMyBuckets'
            Resource: '*'
          - Sid: IAMReadPermissions
            Effect: Allow
            Action:
              - 'iam:GetAccountSummary'
              - 'iam:GetAccountPasswordPolicy'
              - 'iam:ListUsers'
              - 'iam:ListUserPolicies'
              - 'iam:ListAttachedUserPolicies'
              - 'iam:ListMFADevices'
              - 'iam:ListAccessKeys'
              - 'iam:ListRoles'
              - 'iam:ListRolePolicies'
              - 'iam:ListAttachedRolePolicies'
              - 'iam:ListPolicies'
              - 'iam:GetPolicy'
              - 'iam:GetPolicyVersion'
              - 'iam:GenerateCredentialReport'
              - 'iam:GetCredentialReport'
            Resource: '*'
          - Sid: NetworkSecurityPermissions
            Effect: Allow
            Action:
              - 'ec2:DescribeSecurityGroups'
              - 'ec2:DescribeSecurityGroupRules'
              - 'ec2:DescribeRegions'
            Resource: '*'
          - Sid: CloudTrailPermissions
            Effect: Allow
            Action:
              - 'cloudtrail:DescribeTrails'
              - 'cloudtrail:GetTrailStatus'
              - 'cloudtrail:GetEventSelectors'
            Resource: '*'

  CloudSecAuditRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: 'Read-only role for cross-account posture evaluation by Cloud Security Dashboard'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref CloudSecPrincipalArn
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      ManagedPolicyArns:
        - !Ref CloudSecAuditPolicy

Outputs:
  RoleArn:
    Description: 'The ARN of the cross-account role to enter into the CloudSec dashboard'
    Value: !GetAtt CloudSecAuditRole.Arn
  AccountId:
    Description: 'The AWS Account ID'
    Value: !Ref 'AWS::AccountId'

