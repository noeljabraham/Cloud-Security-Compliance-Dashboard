services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudsec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudsec_dev}
      POSTGRES_USER: ${POSTGRES_USER:-cloudsec}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudsec} -d ${POSTGRES_DB:-cloudsec}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:

